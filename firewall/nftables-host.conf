#!/usr/sbin/nft -f

# Clean out existing tables to ensure a predictable state baseline
table inet filter {
    chain input { }
}
table inet nat {
    chain postrouting { }
}
delete table inet filter
delete table inet nat

# Forcefully purge and drop Tailscale's legacy leftover iptables wrappers
table ip filter {
    chain INPUT { }
    chain FORWARD { }
}
table ip nat {
    chain POSTROUTING { }
}
delete table ip filter
delete table ip nat

table inet filter {
    set tailscale-nets {
        type ipv4_addr
        flags interval
        elements = { 100.64.0.0/10 }
    }

    chain input {
        type filter hook input priority filter; policy drop;

        meta nfproto ipv6 drop
        ct state invalid drop
        iif lo accept

        # Infrastructure services strictly bounded to the container bridge interface
        iifname "incusbr0" udp dport 67 accept
        iifname "incusbr0" tcp dport 53 accept
        iifname "incusbr0" udp dport 53 accept

        # Anti-spoofing
        ip saddr @tailscale-nets iifname != "tailscale0" drop

        # Stateful tracking
        ct state established,related accept

        # Secure Tailscale Direct P2P Traversal Listener (WAN Bounded)
        iifname "eth0" udp dport 41641 ct state new accept comment "Tailscale STUN and P2P Traversal"

        # Explicitly allowed Management services over secure fabric
        iifname "tailscale0" ip saddr @tailscale-nets tcp dport 22 ct state new limit rate 5/minute burst 5 packets accept
        iifname "tailscale0" ip saddr @tailscale-nets tcp dport 8443 ct state new limit rate 20/second burst 40 packets accept
        iifname "tailscale0" ip saddr @tailscale-nets icmp type echo-request limit rate 5/second accept

        # Log and drop unauthorized data inside the secure Tailscale fabric over Group 1
        iifname "tailscale0" ip saddr @tailscale-nets limit rate 5/second burst 10 packets log prefix "HOST-TS-UNAUTH-DROP: " group 1
        iifname "tailscale0" ip saddr @tailscale-nets drop

        # Silent drop for legacy/scanning blockchain noise to protect ulogd2 disk space
        iifname "eth0" tcp dport 30333 drop

        # Rate-limited host-level drop logging over NFLOG Group 1
        limit rate 5/second burst 10 packets log prefix "HOST-INPUT-DROP: " group 1
        drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        meta nfproto ipv6 drop
        ct state invalid drop

        # Anti-spoofing for transit frames
        ip saddr @tailscale-nets iifname != "tailscale0" drop
        ip daddr @tailscale-nets oifname != "tailscale0" drop

        # Stateful Forwarding Engine
        ct state established,related accept

        # Route decrypted Tailscale overlay traffic targeting your internal containers
        iifname "tailscale0" oifname "incusbr0" ct state new accept comment "Allow Tailnet traffic into containers"

        # Permit unprivileged outbound requests from containers to WAN
        iifname "incusbr0" oifname "eth0" ct state new accept

        # Block egress transit leaks over NFLOG Group 1
        iifname "tailscale0" oifname "eth0" limit rate 5/second burst 10 packets log prefix "HOST-EXIT-BLOCKED: " group 1
        iifname "tailscale0" oifname "eth0" drop

        # Rate-limited transit forwarding drop logging over NFLOG Group 1
        limit rate 5/second burst 10 packets log prefix "HOST-FORWARD-DROP: " group 1
        drop
    }

    chain output {
        type filter hook output priority filter; policy accept;
        meta nfproto ipv6 drop
    }
}

table inet nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # Tailscale Host Port Preservation Map
        ip saddr != 10.0.0.0/24 udp sport 41641 oifname "eth0" masquerade to :41641 comment "Preserve Host Tailscale source port"

        # Standard address translation for remaining outbound container traffic
        ip saddr 10.0.0.0/24 oifname "eth0" masquerade
    }
}